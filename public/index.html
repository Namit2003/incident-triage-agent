<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Incident Triage Copilot</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--primary-color: #f6821f;
				--primary-hover: #e67e22;
				--accent-blue: #3b82f6;
				--accent-purple: #8b5cf6;
				--bg-dark: #0f172a;
				--bg-card: #1e293b;
				--bg-lighter: #334155;
				--text-primary: #f1f5f9;
				--text-secondary: #94a3b8;
				--border-color: #334155;
				--success-green: #10b981;
				--warning-yellow: #f59e0b;
				--danger-red: #ef4444;

				/* Severity colors */
				--severity-p0: #dc2626;
				--severity-p1: #f97316;
				--severity-p2: #f59e0b;
				--severity-p3: #3b82f6;
				--severity-p4: #64748b;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
					Roboto, sans-serif;
				line-height: 1.6;
				background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
				color: var(--text-primary);
				height: 100vh;
				overflow: hidden;
			}

			.app-container {
				display: grid;
				grid-template-columns: 1fr 400px;
				height: 100vh;
				gap: 0;
			}

			/* Chat Panel (Left) */
			.chat-panel {
				display: flex;
				flex-direction: column;
				background: var(--bg-dark);
				border-right: 1px solid var(--border-color);
			}

			.chat-header {
				padding: 1.5rem;
				background: linear-gradient(135deg, var(--accent-purple), var(--primary-color));
				border-bottom: 1px solid var(--border-color);
			}

			.chat-header h1 {
				font-size: 1.5rem;
				font-weight: 700;
				margin-bottom: 0.25rem;
			}

			.chat-header p {
				font-size: 0.875rem;
				opacity: 0.9;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1.5rem;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			.message {
				padding: 1rem;
				border-radius: 12px;
				max-width: 85%;
				animation: slideIn 0.3s ease-out;
			}

			@keyframes slideIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.user-message {
				background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
				align-self: flex-end;
				margin-left: auto;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.assistant-message {
				background: var(--bg-card);
				align-self: flex-start;
				border: 1px solid var(--border-color);
			}

			.message p {
				white-space: pre-wrap;
				margin: 0;
				word-wrap: break-word;
			}

			.message-timestamp {
				font-size: 0.75rem;
				color: var(--text-secondary);
				margin-top: 0.5rem;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				color: var(--text-secondary);
				padding: 1rem;
				align-self: flex-start;
			}

			.typing-indicator.visible {
				display: block;
			}

			.message-input-container {
				padding: 1.5rem;
				background: var(--bg-card);
				border-top: 1px solid var(--border-color);
			}

			.message-input {
				display: flex;
				gap: 0.75rem;
			}

			#user-input {
				flex: 1;
				padding: 1rem;
				background: var(--bg-lighter);
				border: 1px solid var(--border-color);
				border-radius: 8px;
				color: var(--text-primary);
				font-family: inherit;
				font-size: 0.95rem;
				resize: none;
				min-height: 52px;
				max-height: 150px;
				transition: border-color 0.2s, box-shadow 0.2s;
			}

			#user-input:focus {
				outline: none;
				border-color: var(--primary-color);
				box-shadow: 0 0 0 3px rgba(246, 130, 31, 0.1);
			}

			#send-button {
				padding: 0 1.5rem;
				background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
				color: white;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				font-weight: 600;
				transition: transform 0.2s, box-shadow 0.2s;
				white-space: nowrap;
			}

			#send-button:hover:not(:disabled) {
				transform: translateY(-2px);
				box-shadow: 0 8px 16px rgba(246, 130, 31, 0.3);
			}

			#send-button:active:not(:disabled) {
				transform: translateY(0);
			}

			#send-button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			/* Case Panel (Right) */
			.case-panel {
				background: var(--bg-card);
				overflow-y: auto;
				padding: 1.5rem;
				display: flex;
				flex-direction: column;
				gap: 1.5rem;
			}

			.case-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding-bottom: 1rem;
				border-bottom: 1px solid var(--border-color);
			}

			.case-header h2 {
				font-size: 1.25rem;
				font-weight: 700;
			}

			.case-id {
				font-size: 0.75rem;
				color: var(--text-secondary);
				font-family: monospace;
				margin-top: 0.25rem;
			}

			.severity-badge {
				display: inline-block;
				padding: 0.5rem 1rem;
				border-radius: 8px;
				font-weight: 700;
				font-size: 1rem;
				text-align: center;
				width: 100%;
				animation: fadeIn 0.5s ease-out;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}

			.severity-P0 {
				background: var(--severity-p0);
				color: white;
			}

			.severity-P1 {
				background: var(--severity-p1);
				color: white;
			}

			.severity-P2 {
				background: var(--severity-p2);
				color: white;
			}

			.severity-P3 {
				background: var(--severity-p3);
				color: white;
			}

			.severity-P4 {
				background: var(--severity-p4);
				color: white;
			}

			.section {
				background: var(--bg-lighter);
				padding: 1rem;
				border-radius: 8px;
				border: 1px solid var(--border-color);
			}

			.section-title {
				font-size: 0.875rem;
				font-weight: 600;
				color: var(--text-secondary);
				text-transform: uppercase;
				letter-spacing: 0.5px;
				margin-bottom: 0.75rem;
			}

			.entity-item {
				display: flex;
				justify-content: space-between;
				padding: 0.5rem 0;
				border-bottom: 1px solid var(--border-color);
			}

			.entity-item:last-child {
				border-bottom: none;
			}

			.entity-label {
				color: var(--text-secondary);
				font-size: 0.875rem;
			}

			.entity-value {
				color: var(--text-primary);
				font-weight: 500;
				text-align: right;
				font-size: 0.875rem;
			}

			.action-item {
				display: flex;
				align-items: flex-start;
				gap: 0.75rem;
				padding: 0.75rem;
				background: var(--bg-dark);
				border-radius: 6px;
				margin-bottom: 0.5rem;
				border: 1px solid var(--border-color);
			}

			.action-item:last-child {
				margin-bottom: 0;
			}

			.action-checkbox {
				margin-top: 0.25rem;
				width: 16px;
				height: 16px;
			}

			.action-text {
				flex: 1;
				font-size: 0.875rem;
				line-height: 1.5;
			}

			.timeline-item {
				display: flex;
				gap: 0.75rem;
				padding: 0.75rem 0;
				border-left: 2px solid var(--border-color);
				padding-left: 1rem;
				position: relative;
			}

			.timeline-item::before {
				content: "";
				position: absolute;
				left: -5px;
				top: 1rem;
				width: 8px;
				height: 8px;
				background: var(--primary-color);
				border-radius: 50%;
			}

			.timeline-time {
				color: var(--text-secondary);
				font-size: 0.75rem;
				white-space: nowrap;
				min-width: 80px;
			}

			.timeline-desc {
				font-size: 0.875rem;
				flex: 1;
			}

			.export-button {
				width: 100%;
				padding: 1rem;
				background: linear-gradient(135deg, var(--success-green), #059669);
				color: white;
				border: none;
				border-radius: 8px;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s;
				font-size: 0.95rem;
			}

			.export-button:hover {
				transform: translateY(-2px);
				box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
			}

			.export-button:active {
				transform: translateY(0);
			}

			.export-button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.empty-state {
				color: var(--text-secondary);
				font-style: italic;
				font-size: 0.875rem;
				text-align: center;
				padding: 1rem;
			}

			/* Status badge */
			.status-badge {
				display: inline-block;
				padding: 0.25rem 0.75rem;
				border-radius: 4px;
				font-size: 0.75rem;
				font-weight: 600;
				text-transform: uppercase;
			}

			.status-intake {
				background: var(--accent-blue);
				color: white;
			}

			.status-clarifying {
				background: var(--warning-yellow);
				color: white;
			}

			.status-triaged {
				background: var(--success-green);
				color: white;
			}

			.status-closed {
				background: var(--severity-p4);
				color: white;
			}

			/* Scrollbar styling */
			.chat-messages::-webkit-scrollbar,
			.case-panel::-webkit-scrollbar {
				width: 8px;
			}

			.chat-messages::-webkit-scrollbar-track,
			.case-panel::-webkit-scrollbar-track {
				background: var(--bg-dark);
			}

			.chat-messages::-webkit-scrollbar-thumb,
			.case-panel::-webkit-scrollbar-thumb {
				background: var(--border-color);
				border-radius: 4px;
			}

			.chat-messages::-webkit-scrollbar-thumb:hover,
			.case-panel::-webkit-scrollbar-thumb:hover {
				background: var(--bg-lighter);
			}

			/* Responsive design */
			@media (max-width: 1024px) {
				.app-container {
					grid-template-columns: 1fr;
					grid-template-rows: 1fr auto;
				}

				.case-panel {
					max-height: 40vh;
					border-top: 1px solid var(--border-color);
					border-right: none;
				}
			}

			@media (max-width: 768px) {
				.chat-header {
					padding: 1rem;
				}

				.chat-header h1 {
					font-size: 1.25rem;
				}

				.chat-messages {
					padding: 1rem;
				}

				.message {
					max-width: 90%;
				}

				.case-panel {
					padding: 1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="app-container">
			<!-- Chat Panel -->
			<div class="chat-panel">
				<div class="chat-header">
					<h1>🚨 Incident Triage Copilot</h1>
					<p>AI-powered incident classification and response</p>
				</div>

				<div id="chat-messages" class="chat-messages">
					<!-- Messages will be inserted here -->
				</div>

				<div class="typing-indicator" id="typing-indicator">
					AI is analyzing...
				</div>

				<div class="message-input-container">
					<div class="message-input">
						<textarea
							id="user-input"
							placeholder="Describe the incident (e.g., 'Payment API is returning 500 errors in us-west-2...')"
							rows="1"
							autofocus
						></textarea>
						<button id="send-button">Send</button>
					</div>
				</div>
			</div>

			<!-- Case Panel -->
			<aside class="case-panel">
				<div class="case-header">
					<div>
						<h2>Case Details</h2>
						<div class="case-id" id="case-id">Loading...</div>
					</div>
				</div>

				<!-- Status -->
				<div class="section">
					<div class="section-title">Status</div>
					<span class="status-badge status-intake" id="status-badge"
						>Intake</span
					>
				</div>

				<!-- Severity -->
				<div class="section" id="severity-section" style="display: none">
					<div class="section-title">Severity</div>
					<div class="severity-badge" id="severity-badge">Not classified</div>
				</div>

				<!-- Entities -->
				<div class="section">
					<div class="section-title">Incident Details</div>
					<div id="entities-content">
						<div class="empty-state">
							Awaiting incident information...
						</div>
					</div>
				</div>

				<!-- Actions -->
				<div class="section">
					<div class="section-title">Next Actions</div>
					<div id="actions-content">
						<div class="empty-state">No actions yet</div>
					</div>
				</div>

				<!-- Timeline -->
				<div class="section">
					<div class="section-title">Timeline</div>
					<div id="timeline-content">
						<div class="empty-state">No events yet</div>
					</div>
				</div>

				<!-- Export Button -->
				<button class="export-button" id="export-button" disabled>
					📄 Export Status Update
				</button>
			</aside>
		</div>

		<script src="chat.js"></script>
	</body>
</html>
